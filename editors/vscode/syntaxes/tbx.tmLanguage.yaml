# TextMate grammar for Timbrex (.tbx), grammar version timbrex: 1.
# Shared by VS Code, Cursor, Sublime Text, and other TextMate editors.
# Tokens follow SPEC v0.3.4. This file does not know the cast list, so any
# column-0 ident: is colored as a speaker. The compiler still requires cast.
scopeName: source.tbx
fileTypes:
  - tbx
  - timbrex
name: Timbrex
patterns:
  - include: "#front-matter"
  - include: "#comment"
  - include: "#fence"
  - include: "#escape"
  - include: "#speaker"
  - include: "#tag"

repository:
  # YAML between --- lines at the start of the file is configuration.
  front-matter:
    begin: \A---[ \t]*$
    beginCaptures:
      "0": {name: punctuation.definition.front-matter.begin.tbx}
    end: ^---[ \t]*$
    endCaptures:
      "0": {name: punctuation.definition.front-matter.end.tbx}
    name: meta.embedded.block.yaml.front-matter.tbx
    patterns:
      - include: source.yaml

  # "//" is a comment only at the start of a line, after optional spaces.
  comment:
    match: ^[ \t]*//.*$
    name: comment.line.double-slash.tbx

  # A fence is raw passthrough and needs a non-empty info string.
  # The interior is not Timbrex markup.
  fence:
    begin: ^[ \t]*```[ \t]*(\S.*)$
    beginCaptures:
      "0": {name: punctuation.definition.fence.begin.tbx}
      "1": {name: keyword.control.fence-info.tbx}
    end: ^[ \t]*```[ \t]*$
    endCaptures:
      "0": {name: punctuation.definition.fence.end.tbx}
    name: meta.embedded.block.fence.tbx
    contentName: string.unquoted.fence.tbx

  # SPEC escapes: [[ ]] and a backslash before [ ] | \ :
  escape:
    match: '\[\[|\]\]|\\[\[\]|\\:]'
    name: constant.character.escape.tbx

  # speaker_id sits at column 0. lin\: does not match, because "\:" is an escape.
  speaker:
    match: '^([A-Za-z][A-Za-z0-9_.-]*)(:)'
    captures:
      "1": {name: entity.name.function.speaker.tbx}
      "2": {name: punctuation.separator.speaker.tbx}

  string:
    match: '"([^"\\]|\\.)*"'
    name: string.quoted.double.tbx

  # [name args] or [name args|content].
  # A "[" or "]" is escaped only when an odd run of backslashes precedes it,
  # so \\[pause] is a literal backslash plus a tag.
  # ]] is a literal ] inside a single tag. A tag opened from content closes
  # on the next unescaped ], so [whisper|say [pause 1s]] is two tags.
  tag:
    begin: '(?<=(?:^|[^\\])(?:\\\\)*)(\[)(?!\[)[ \t]*([A-Za-z][A-Za-z0-9_.-]*(?::[A-Za-z][A-Za-z0-9_.-]*)?)?'
    beginCaptures:
      "1": {name: punctuation.definition.tag.begin.tbx}
      "2": {name: entity.name.tag.tbx}
    end: '(?<=(?:^|[^\\])(?:\\\\)*)\](?!\])'
    endCaptures:
      "0": {name: punctuation.definition.tag.end.tbx}
    name: meta.tag.tbx
    patterns:
      - include: "#tag-content"
      - include: "#tag-arg"

  # Inner tags close on ], even when the next character is the outer closer.
  tag-nested:
    begin: '(?<=(?:^|[^\\])(?:\\\\)*)(\[)(?!\[)[ \t]*([A-Za-z][A-Za-z0-9_.-]*(?::[A-Za-z][A-Za-z0-9_.-]*)?)?'
    beginCaptures:
      "1": {name: punctuation.definition.tag.begin.tbx}
      "2": {name: entity.name.tag.tbx}
    end: '(?<=(?:^|[^\\])(?:\\\\)*)\]'
    endCaptures:
      "0": {name: punctuation.definition.tag.end.tbx}
    name: meta.tag.tbx
    patterns:
      - include: "#tag-content-nested"
      - include: "#tag-arg"

  # Text after an unescaped "|" is content. Quotes are ordinary spoken text.
  tag-content:
    begin: '(?<=(?:^|[^\\])(?:\\\\)*)\|'
    beginCaptures:
      "0": {name: punctuation.separator.tag-content.tbx}
    end: '(?=(?<=(?:^|[^\\])(?:\\\\)*)\](?!\]))'
    name: meta.tag.content.tbx
    patterns:
      - include: "#escape"
      - include: "#tag-nested"

  tag-content-nested:
    begin: '(?<=(?:^|[^\\])(?:\\\\)*)\|'
    beginCaptures:
      "0": {name: punctuation.separator.tag-content.tbx}
    end: '(?=(?<=(?:^|[^\\])(?:\\\\)*)\])'
    name: meta.tag.content.tbx
    patterns:
      - include: "#escape"
      - include: "#tag-nested"

  tag-arg:
    patterns:
      - include: "#string"
      - include: "#escape"
      - match: '([A-Za-z_][A-Za-z0-9_.-]*)(=)'
        captures:
          "1": {name: entity.other.attribute-name.tbx}
          "2": {name: punctuation.separator.key-value.tbx}
      # Longer suffixes are listed before "s" (st, ms, min).
      # The suffix must end the token. "10stone" is one argument, not 10st + one.
      - match: '[+-]?(?:\d+\.\d+|\d+)(?:ms|min|st|dB|%|s)?(?![A-Za-z0-9_.-])'
        name: constant.numeric.tbx
      - match: '[+-]?(?:\d+\.\d+|\d+)[A-Za-z_][A-Za-z0-9_.-]*'
        name: variable.parameter.tbx
      - match: '[A-Za-z_][A-Za-z0-9_.-]*'
        name: variable.parameter.tbx
