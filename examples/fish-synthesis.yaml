# Set FISH_API_KEY and replace the accessible existing reference ID.
# Inspect offline: timbrex --config examples/fish-synthesis.yaml config
# Official fields:
# https://docs.fish.audio/api-reference/endpoint/openapi-v1/text-to-speech#body-features
# https://docs.fish.audio/api-reference/endpoint/openapi-v1/text-to-speech#body-pronunciation-dictionary
provider: fish
providers:
  fish:
    model: s2.1-pro
    voice: YOUR_REFERENCE_ID
    synthesis:
      normalize: true
      normalization_language: en
      prosody:
        normalize_loudness: false
      temperature: 0.7
      top_p: 0.7
      chunk_length: 200
      min_chunk_length: 0
      latency: balanced
      condition_on_previous_chunks: false
      early_stop_threshold: 0
      features: [quality-guard] # Backend-dependent; [] requests no flags.
      pronunciation_dictionary:
        - items:
            - key: Timbrex
              value: "tɪmbɹɛks" # Phonetic form, not a spelling alias.
              case_sensitive: false
      # Alternatively replace the entire dictionary list with existing refs:
      # pronunciation_dictionary:
      #   - id: YOUR_EXISTING_DICTIONARY_ID
      #     version: YOUR_IMMUTABLE_VERSION
      # Never mix refs with inline dictionaries. [] explicitly sends no entries.
