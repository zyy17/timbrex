# Supply ELEVENLABS_API_KEY in the environment and replace the voice ID.
# Inspect without a network call:
#   timbrex --config examples/elevenlabs-synthesis.yaml config
# Synthesis uses the selected paid provider:
#   timbrex --config examples/elevenlabs-synthesis.yaml synth examples/hello.tbx
provider: elevenlabs
providers:
  elevenlabs:
    model: eleven_v3
    voice: YOUR_VOICE_ID
    synthesis:
      seed: 42
      apply_text_normalization: auto
      apply_language_text_normalization: false
      voice_settings:
        stability: 0.5
        similarity_boost: 0.75
        style: 0
        use_speaker_boost: false
      # Replace [] only with existing dictionary IDs you are authorized to use.
      pronunciation_dictionary_locators: []
